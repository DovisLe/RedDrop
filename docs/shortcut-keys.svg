<svg xmlns="http://www.w3.org/2000/svg" width="340" height="72" viewBox="0 0 340 72" role="img" aria-label="Ctrl + Alt + Y">
  <title>Ctrl + Alt + Y</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#e2281f"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
    .key { fill: #ffffff; font-size: 24px; }
    .plus { fill: #8b8b95; font-size: 28px; font-weight: 600; }
  </style>

  <rect x="4" y="10" width="100" height="58" rx="12" fill="#a51a13"/>
  <rect x="4" y="4" width="100" height="58" rx="12" fill="url(#cap)"/>
  <text class="key" x="54" y="34" text-anchor="middle" dominant-baseline="central">Ctrl</text>

  <text class="plus" x="126" y="35" text-anchor="middle" dominant-baseline="central">+</text>

  <rect x="148" y="10" width="88" height="58" rx="12" fill="#a51a13"/>
  <rect x="148" y="4" width="88" height="58" rx="12" fill="url(#cap)"/>
  <text class="key" x="192" y="34" text-anchor="middle" dominant-baseline="central">Alt</text>

  <text class="plus" x="258" y="35" text-anchor="middle" dominant-baseline="central">+</text>

  <rect x="280" y="10" width="56" height="58" rx="12" fill="#a51a13"/>
  <rect x="280" y="4" width="56" height="58" rx="12" fill="url(#cap)"/>
  <text class="key" x="308" y="34" text-anchor="middle" dominant-baseline="central">Y</text>
</svg>
